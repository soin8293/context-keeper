name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -X utf8 -m pip install -r requirements-dev.txt
      - run: python -X utf8 scripts/skills.py check
      - run: python -X utf8 scripts/check_release.py
      - run: python -X utf8 scripts/skills.py test
      - run: python -X utf8 examples/demo.py "${{ runner.temp }}/context-keeper-demo" --prepare-only
      - run: python -X utf8 examples/demo.py "${{ runner.temp }}/context-keeper-demo"
